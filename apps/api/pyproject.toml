[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wiggle-api"
version = "0.1.0"
description = "Wiggle's FastAPI domain service"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.135.3",
  "pydantic==2.11.7",
  "uvicorn[standard]==0.35.0"
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "mypy==1.20.0",
  "pytest==8.4.2",
  "ruff==0.13.1"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:asyncio -p no:cacheprovider"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]
